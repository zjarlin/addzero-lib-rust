<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIO Admin Prototype Board</title>
  <style>
    :root {
      --canvas: #e8e2d6;
      --paper: #fbfaf6;
      --panel: #fffefb;
      --ink: #171a17;
      --muted: #6e706b;
      --line: #d7d0c3;
      --rail: #f2ede4;
      --active: #101312;
      --mint: #1f766f;
      --amber: #b25e26;
      --blue: #315f91;
      --rose: #9a3f51;
      --shadow: 0 18px 46px rgba(35, 31, 24, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Avenir Next", "Gill Sans", "Segoe UI", sans-serif;
    }

    .board {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    .index {
      border-right: 1px solid var(--line);
      background: #f4efe6;
      padding: 20px;
      overflow: auto;
    }

    .index h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .index p {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .token-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 18px 0 24px;
    }

    .token {
      height: 28px;
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    .toc {
      display: grid;
      gap: 8px;
    }

    .toc a {
      border: 1px solid transparent;
      color: var(--ink);
      display: block;
      padding: 9px 10px;
      text-decoration: none;
      font-size: 13px;
    }

    .toc a:hover {
      background: #fffaf0;
      border-color: var(--line);
    }

    .toc span {
      color: var(--muted);
      display: block;
      font-size: 11px;
      margin-top: 2px;
    }

    .canvas {
      overflow: auto;
      padding: 28px;
    }

    .frames {
      display: grid;
      gap: 28px;
      min-width: 1160px;
    }

    .frame-wrap {
      display: grid;
      gap: 10px;
    }

    .frame-label {
      align-items: center;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      width: 1160px;
    }

    .frame-label h2 {
      font-size: 15px;
      margin: 0;
    }

    .frame-label .route {
      color: var(--muted);
      font-family: "SFMono-Regular", "Cascadia Code", monospace;
      font-size: 12px;
    }

    .screen {
      background: var(--paper);
      border: 1px solid #cfc7b8;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr);
      height: 700px;
      width: 1160px;
    }

    .topbar {
      align-items: center;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
    }

    .axis {
      display: flex;
      gap: 8px;
    }

    .axis span,
    .actions span,
    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      display: inline-flex;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .axis span.active,
    .badge.active {
      background: var(--active);
      border-color: var(--active);
      color: #fff;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .app {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 0;
    }

    .side {
      background: var(--rail);
      border-right: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
    }

    .side-head {
      border-bottom: 1px solid var(--line);
      padding: 16px;
    }

    .side-head strong {
      display: block;
      font-size: 13px;
    }

    .side-head p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin: 6px 0 0;
    }

    .nav-tree {
      display: grid;
      gap: 8px;
      overflow: hidden;
      padding: 14px;
    }

    .nav-section {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.16em;
      margin: 8px 0 2px;
      text-transform: uppercase;
    }

    .nav-item {
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 650;
      padding: 8px 10px;
    }

    .nav-item.active {
      background: #fff;
      border-color: var(--line);
      box-shadow: 0 8px 20px rgba(31, 25, 16, 0.05);
    }

    .nav-child {
      margin-left: 16px;
    }

    .content {
      display: grid;
      gap: 0;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      overflow: hidden;
    }

    .hero {
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
      padding: 18px 22px 16px;
    }

    .kicker {
      align-items: center;
      color: var(--muted);
      display: flex;
      font-size: 11px;
      font-weight: 750;
      gap: 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .hero-row {
      align-items: start;
      display: flex;
      justify-content: space-between;
      gap: 18px;
    }

    .hero h3 {
      font-size: 28px;
      line-height: 1.08;
      margin: 0;
    }

    .hero p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin: 8px 0 0;
      max-width: 680px;
    }

    .body {
      display: grid;
      gap: 0;
      min-height: 0;
      overflow: hidden;
    }

    .body.two {
      grid-template-columns: 1.05fr 0.95fr;
    }

    .body.three {
      grid-template-columns: 0.9fr 1.2fr 0.9fr;
    }

    .body.blinko {
      background: #f7f7f6;
      display: grid;
      gap: 14px;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 14px;
    }

    .panel {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      min-height: 0;
      padding: 16px;
    }

    .panel:last-child {
      border-right: 0;
    }

    .panel h4 {
      font-size: 15px;
      margin: 0 0 8px;
    }

    .panel p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .row {
      align-items: center;
      border: 1px solid var(--line);
      display: flex;
      gap: 10px;
      justify-content: space-between;
      min-height: 38px;
      padding: 9px 10px;
    }

    .row strong {
      font-size: 12px;
    }

    .row small {
      color: var(--muted);
      display: block;
      font-size: 11px;
      margin-top: 2px;
    }

    .status {
      border-radius: 999px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 5px 8px;
      white-space: nowrap;
    }

    .status.mint { background: var(--mint); }
    .status.amber { background: var(--amber); }
    .status.blue { background: var(--blue); }
    .status.rose { background: var(--rose); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      padding: 12px;
    }

    .metric b {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .metric span {
      color: var(--muted);
      display: block;
      font-size: 11px;
      margin-top: 8px;
    }

    .table {
      border: 1px solid var(--line);
      display: grid;
      font-size: 12px;
    }

    .table::before {
      background: #f3f1ec;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      content: "TanStack Table: toolbar / columns / rows / pagination";
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      padding: 8px 10px;
      text-transform: uppercase;
    }

    .table .tr {
      display: grid;
      grid-template-columns: 1.1fr 0.8fr 0.7fr;
    }

    .table .tr + .tr {
      border-top: 1px solid var(--line);
    }

    .table span {
      border-right: 1px solid var(--line);
      padding: 9px 10px;
    }

    .table span:last-child {
      border-right: 0;
    }

    .editor {
      background: #161917;
      color: #e6f0dc;
      font-family: "SFMono-Regular", "Cascadia Code", monospace;
      font-size: 12px;
      min-height: 230px;
      padding: 14px;
      white-space: pre-wrap;
    }

    .graph {
      align-items: center;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      border: 1px solid var(--line);
      display: grid;
      height: 210px;
      justify-items: center;
      position: relative;
    }

    .node {
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 10px;
      position: absolute;
    }

    .node.a { left: 38px; top: 40px; }
    .node.b { right: 54px; top: 58px; }
    .node.c { left: 42%; bottom: 38px; }

    .kanban {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .lane {
      border: 1px solid var(--line);
      min-height: 250px;
      padding: 10px;
    }

    .lane h5 {
      font-size: 12px;
      margin: 0 0 10px;
    }

    .quick-note {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(20, 20, 18, 0.06);
      display: grid;
      min-height: 148px;
    }

    .quick-tools,
    .quick-footer {
      align-items: center;
      color: var(--muted);
      display: flex;
      gap: 14px;
      padding: 12px 14px;
    }

    .quick-text {
      color: #161b2b;
      font-size: 16px;
      line-height: 1.55;
      padding: 0 14px 18px;
    }

    .note-wall {
      columns: 2;
      column-gap: 14px;
      overflow: hidden;
    }

    .note-card {
      background: #fff;
      border: 1px solid transparent;
      border-radius: 16px;
      break-inside: avoid;
      box-shadow: 0 8px 18px rgba(20, 20, 18, 0.045);
      margin: 0 0 14px;
      padding: 14px;
    }

    .note-card time {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .note-card p {
      color: #111827;
      font-size: 14px;
      line-height: 1.65;
      margin: 0 0 12px;
    }

    @media (max-width: 900px) {
      .board {
        grid-template-columns: 1fr;
      }

      .index {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="board">
    <aside class="index">
      <h1>AIO Admin Prototype Board</h1>
      <p>主轴场景、左侧路由树、内容区组件的 Figma-ready 原型基准。</p>
      <div class="token-strip">
        <div class="token" style="background:#fbfaf6"></div>
        <div class="token" style="background:#171a17"></div>
        <div class="token" style="background:#1f766f"></div>
        <div class="token" style="background:#b25e26"></div>
        <div class="token" style="background:#315f91"></div>
      </div>
      <nav class="toc" id="toc"></nav>
    </aside>
    <main class="canvas">
      <div class="frames" id="frames"></div>
    </main>
  </div>

  <script>
    const scenes = ["工作台", "资产", "运行", "插件", "系统"];
    const navs = {
      "工作台": [["平台工作台", ["平台总览"]]],
      "资产": [
        ["个人资产", ["资产文件", "笔记", "安装包", "dotfiles"]],
        ["Agent 资产", ["Agent 资产总览", "Skills", "CLI", "MCP"]]
      ],
      "运行": [["运行时", ["脚本控制台", "环境与配置"]]],
      "插件": [["插件系统", ["WASM 插件市场"]]],
      "系统": [["系统", ["系统管理", "权限菜单树", "用户与角色"]]]
    };

    const frames = [
      {
        id: "workbench-overview",
        scene: "工作台",
        route: "/",
        activeNav: "平台总览",
        kicker: "Platform Context",
        title: "平台总览",
        summary: "工作台只承载全局状态、能力域健康度、近期任务和下一步落点，不直接混入资产或运行子路由。",
        layout: "two",
        panels: [
          { title: "平台状态", kind: "metrics", rows: [["API", "Ready"], ["插件", "4"], ["阶段", "Shell"]] },
          { title: "能力域", kind: "list", rows: ["资产", "运行", "插件", "系统"] }
        ]
      },
      {
        id: "asset-files",
        scene: "资产",
        route: "/assets/files",
        activeNav: "资产文件",
        kicker: "Asset Context",
        title: "资产文件",
        summary: "文件界面以目录树、对象列表、引用详情三栏为主，面向反复浏览和批量操作。",
        layout: "three",
        panels: [
          { title: "目录树", kind: "list", rows: ["workspace", "packages", "exports", "plugins"] },
          { title: "文件列表", kind: "table", rows: [["aio-plugin.wasm", "Plugin", "Ready"], ["dotfiles.zip", "Archive", "Draft"], ["notes.md", "Note", "Indexed"]] },
          { title: "对象详情", kind: "list", rows: ["引用: 3", "校验和: sha256", "来源: local import"] }
        ]
      },
      {
        id: "asset-notes",
        scene: "资产",
        route: "/assets/notes",
        activeNav: "笔记",
        kicker: "Blinko Reference",
        title: "闪念笔记",
        summary: "参考 Blinko：顶部快速记录区，下面双列卡片流；保留搜索、筛选、标签、附件和快速发送。",
        layout: "blinko",
        panels: []
      },
      {
        id: "asset-packages",
        scene: "资产",
        route: "/assets/packages",
        activeNav: "安装包",
        kicker: "Package Asset",
        title: "安装包",
        summary: "安装包界面管理 CLI 包、桌面包、插件包、版本、校验和与安装记录。",
        layout: "two",
        panels: [
          { title: "包目录", kind: "table", rows: [["aio-desktop.dmg", "Desktop", "Published"], ["codex-skill.tgz", "Skill", "Draft"], ["plugin.aio-plugin", "Plugin", "Ready"]] },
          { title: "发布流水", kind: "kanban", rows: ["Collected", "Verified", "Released"] }
        ]
      },
      {
        id: "asset-dotfiles",
        scene: "资产",
        route: "/assets/dotfiles",
        activeNav: "dotfiles",
        kicker: "Machine Asset",
        title: "dotfiles",
        summary: "dotfiles 界面以机器画像、配置差异、同步动作和恢复点为主。",
        layout: "two",
        panels: [
          { title: "机器画像", kind: "metrics", rows: [["Hosts", "3"], ["Drift", "7"], ["Backups", "12"]] },
          { title: "配置差异", kind: "table", rows: [["zshrc", "Changed", "Review"], ["gitconfig", "Synced", "OK"], ["nvim", "Missing", "Apply"]] }
        ]
      },
      {
        id: "agent-assets",
        scene: "资产",
        route: "/assets/agents",
        activeNav: "Agent 资产总览",
        kicker: "Agent Asset",
        title: "Agent 资产总览",
        summary: "Agent 资产总览负责聚合 skill、CLI、MCP 和插件元数据，展示可装载能力与发布状态。",
        layout: "two",
        panels: [
          { title: "能力盘点", kind: "metrics", rows: [["Skills", "9"], ["CLI", "4"], ["MCP", "2"]] },
          { title: "资产分布", kind: "list", rows: ["Skills: workflow knowledge", "CLI: repeatable commands", "MCP: tool servers"] }
        ]
      },
      {
        id: "agent-skills",
        scene: "资产",
        route: "/assets/agents/skills",
        activeNav: "Skills",
        kicker: "Skill Library",
        title: "Agent Skills",
        summary: "Skills 界面展示技能包、触发说明、引用资料、脚本和资产文件，支持版本化维护。",
        layout: "three",
        panels: [
          { title: "技能列表", kind: "list", rows: ["frontend-design", "rust-best-practices", "zjarlin-engineering"] },
          { title: "Skill.md 预览", kind: "editor", rows: ["---\nname: frontend-design\n---\nUse when building production UI screens."] },
          { title: "引用资产", kind: "list", rows: ["references", "scripts", "assets"] }
        ]
      },
      {
        id: "agent-cli",
        scene: "资产",
        route: "/assets/agents/cli",
        activeNav: "CLI",
        kicker: "Command Asset",
        title: "Agent CLI",
        summary: "CLI 界面记录命令契约、参数 schema、安装方式和运行结果，后续与 API contract 对齐。",
        layout: "two",
        panels: [
          { title: "命令目录", kind: "table", rows: [["aio assets scan", "read", "JSON"], ["aio dotfiles sync", "write", "Plan"], ["aio skill pack", "build", "Artifact"]] },
          { title: "参数契约", kind: "editor", rows: ["{\n  \"cwd\": \"string\",\n  \"format\": \"json\",\n  \"dry_run\": true\n}"] }
        ]
      },
      {
        id: "agent-mcp",
        scene: "资产",
        route: "/assets/agents/mcp",
        activeNav: "MCP",
        kicker: "Tool Server Asset",
        title: "Agent MCP",
        summary: "MCP 界面管理 server、tools、权限边界、连接健康和本地配置来源。",
        layout: "two",
        panels: [
          { title: "Server 列表", kind: "table", rows: [["chrome-devtools", "Connected", "tools"], ["playwright", "Connected", "tools"], ["figma", "Missing", "setup"]] },
          { title: "工具暴露", kind: "list", rows: ["read resources", "inspect tools", "health check", "permission boundary"] }
        ]
      },
      {
        id: "runtime-console",
        scene: "运行",
        route: "/console",
        activeNav: "脚本控制台",
        kicker: "Runtime",
        title: "脚本控制台",
        summary: "运行界面以编辑器、运行输出、环境变量、Codex 会话为主要工作区。",
        layout: "three",
        panels: [
          { title: "脚本库", kind: "list", rows: ["saved/rhai-demo", "saved/env-check", "draft/new-script"] },
          { title: "编辑器", kind: "editor", rows: ["print(\"Hello from AIO\");\nlet name = \"World\";\n`Hello, ${name}!`;"] },
          { title: "输出", kind: "list", rows: ["exit_code: 0", "duration: 12ms", "stdout: Hello"] }
        ]
      },
      {
        id: "runtime-config",
        scene: "运行",
        route: "/env",
        activeNav: "环境与配置",
        kicker: "Configuration",
        title: "环境与配置",
        summary: "配置界面维护品牌、模型、对象存储和本地配置文件入口。",
        layout: "two",
        panels: [
          { title: "模型配置", kind: "editor", rows: ["base_url=https://api.openai.com/v1\nmodel=gpt-5.4\napi_key=********"] },
          { title: "配置文件", kind: "list", rows: ["aio.env", "branding.json", "storage.toml"] }
        ]
      },
      {
        id: "plugin-market",
        scene: "插件",
        route: "/market",
        activeNav: "WASM 插件市场",
        kicker: "Plugin Runtime",
        title: "WASM 插件市场",
        summary: "插件界面突出单宿主拓扑、WASM 生命周期、扩展点契约和已装载实例。",
        layout: "two",
        panels: [
          { title: "宿主拓扑", kind: "metrics", rows: [["前端", "1"], ["后端", "1"], ["插件端口", "0"]] },
          { title: "运行时实例", kind: "table", rows: [["builtin.script", "Active", "builtin"], ["com.demo.wasm", "Disabled", "wasm"], ["market.index", "Planned", "registry"]] }
        ]
      },
      {
        id: "system-admin",
        scene: "系统",
        route: "/system",
        activeNav: "系统管理",
        kicker: "System Boundary",
        title: "系统管理",
        summary: "系统界面集中身份、权限、菜单、组织上下文和安全边界。",
        layout: "two",
        panels: [
          { title: "权限矩阵", kind: "table", rows: [["admin", "all", "enabled"], ["operator", "runtime", "enabled"], ["viewer", "read", "draft"]] },
          { title: "元数据", kind: "list", rows: ["菜单树", "字典", "组织", "安全策略"] }
        ]
      }
    ];

    function statusClass(value) {
      const lower = String(value).toLowerCase();
      if (lower.includes("ready") || lower.includes("ok") || lower.includes("active") || lower.includes("published") || lower.includes("connected")) return "mint";
      if (lower.includes("draft") || lower.includes("review") || lower.includes("planned")) return "amber";
      if (lower.includes("missing") || lower.includes("disabled")) return "rose";
      return "blue";
    }

    function renderPanel(panel) {
      if (panel.kind === "metrics") {
        return `<div class="metrics">${panel.rows.map(([label, value]) => `<div class="metric"><b>${value}</b><span>${label}</span></div>`).join("")}</div>`;
      }
      if (panel.kind === "table") {
        return `<div class="table">${panel.rows.map(row => `<div class="tr">${row.map((cell, index) => index === row.length - 1 ? `<span><em class="status ${statusClass(cell)}">${cell}</em></span>` : `<span>${cell}</span>`).join("")}</div>`).join("")}</div>`;
      }
      if (panel.kind === "quick-note") {
        return "";
      }
      if (panel.kind === "editor") {
        return `<div class="editor">${panel.rows[0].replace(/[&<>]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[char]))}</div>`;
      }
      if (panel.kind === "graph") {
        return `<div class="graph"><div class="node a">${panel.rows[0]}</div><div class="node b">${panel.rows[1]}</div><div class="node c">${panel.rows[2]}</div></div>`;
      }
      if (panel.kind === "kanban") {
        return `<div class="kanban">${panel.rows.map((lane, index) => `<div class="lane"><h5>${lane}</h5><div class="row"><strong>${index === 0 ? "collect" : index === 1 ? "verify" : "publish"}</strong><span class="status ${index === 2 ? "mint" : "amber"}">${index === 2 ? "Ready" : "Queue"}</span></div></div>`).join("")}</div>`;
      }
      return `<div class="list">${panel.rows.map(row => `<div class="row"><div><strong>${row}</strong><small>${panel.title}</small></div><span class="status blue">Item</span></div>`).join("")}</div>`;
    }

    function renderNav(scene, activeNav) {
      return navs[scene].map(([section, items]) => `
        <div class="nav-section">${section}</div>
        ${items.map(item => `<div class="nav-item ${item === activeNav ? "active" : ""} ${["Skills", "CLI", "MCP"].includes(item) ? "nav-child" : ""}">${item}</div>`).join("")}
      `).join("");
    }

    function renderFrame(frame) {
      const bodyHtml = frame.layout === "blinko"
        ? `<div class="body blinko">
            <section class="quick-note">
              <div class="quick-tools">☺ H B I S 🔗 • 1. ☑ ▦ {"{ }"} ...</div>
              <div class="quick-text">for c in tl tr bl br; do defaults write com.apple.dock "wvous-$c-corner" -int 0; defaults write com.apple.dock "wvous-$c-modifier" -int 0; done; killall Dock</div>
              <div class="quick-footer">⚡ # 🔗 🏷︎ ✎ ⤴ ⛶ {"</>"} <span class="badge active">发送</span></div>
            </section>
            <section class="note-wall">
              ${[
                ["2026-05-07 20:14:00", "for c in tl tr bl br; do defaults write com.apple.dock ... 关闭 macOS 触发角"],
                ["2026-05-07 19:45:54", "{\"error\":{\"code\":\"invalid_request\",\"message\":\"unsupported responses tool type custom\"}}"],
                ["2026-05-07 12:59:28", "如果远端是 Mac mini，macOS 自带屏幕共享可以直接连接，Finder 里按 Command + K。"],
                ["2026-05-04 23:28:38", "头脑风暴：需要一个 all in one 的资产工具，把笔记、安装包、skill、配置文件管理起来。"],
                ["2026-05-02 23:36:18", "strum = { version = \"0.26\", features = [\"derive\"] } 以后写 rust 记得这个库。"]
              ].map(([time, body]) => `<article class="note-card"><time>${time}</time><p>${body}</p><span class="badge">⚡ 闪念</span></article>`).join("")}
            </section>
          </div>`
        : `<div class="body ${frame.layout}">
            ${frame.panels.map(panel => `<section class="panel"><h4>${panel.title}</h4><p>${frame.title} / ${panel.title}</p>${renderPanel(panel)}</section>`).join("")}
          </div>`;
      return `
        <section class="frame-wrap" id="${frame.id}">
          <div class="frame-label">
            <h2>${frame.title}</h2>
            <div class="route">${frame.route}</div>
          </div>
          <div class="screen">
            <div class="topbar">
              <div class="axis">${scenes.map(scene => `<span class="${scene === frame.scene ? "active" : ""}">${scene}</span>`).join("")}</div>
              <div class="actions"><span>主题</span><span>搜索</span><span>登出</span></div>
            </div>
            <div class="app">
              <aside class="side">
                <div class="side-head"><strong>${frame.scene}路由树</strong><p>${frame.scene === "资产" ? "文件、笔记、安装包、dotfiles、Agent 资产" : frame.scene + "上下文树"}</p></div>
                <div class="nav-tree">${renderNav(frame.scene, frame.activeNav)}</div>
              </aside>
              <main class="content">
                <header class="hero">
                  <div class="kicker">${frame.kicker}</div>
                  <div class="hero-row">
                    <div><h3>${frame.title}</h3><p>${frame.summary}</p></div>
                    <span class="badge active">${frame.activeNav}</span>
                  </div>
                </header>
                ${bodyHtml}
              </main>
            </div>
          </div>
        </section>
      `;
    }

    document.getElementById("toc").innerHTML = frames.map(frame => `<a href="#${frame.id}">${frame.title}<span>${frame.route}</span></a>`).join("");
    document.getElementById("frames").innerHTML = frames.map(renderFrame).join("");
  </script>
</body>
</html>
