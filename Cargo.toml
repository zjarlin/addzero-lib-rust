[workspace]
resolver = "2"
members = [
    "crates/algorithm/algorithm",
    "crates/algorithm/onnx",
    "crates/algorithm/ocr",
    "crates/api/*",
    "crates/config/*",
    "crates/core/*",
    "crates/data/*",
    "crates/micro/*",
    "crates/network/*",
    "crates/runtime/*",
    "crates/storage/*",
    "crates/text/*",
    "crates/tool-project-diagnostics",
    "crates/ui/file-viewer",
    "apps/drive/backend",
]
exclude = [
    "apps/aio/desktop",
    "crates/data/az-crud-base",
    "crates/data/crud-base",
    "crates/network/browser-automation",
    "crates/runtime/admin-domain-audit",
    "crates/ui/dioxus-components",
    "crates/ui/dioxus-nox-markdown",
    "crates/text/az-str",
]

[workspace.package]
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
homepage = "https://github.com/zjarlin/addzero-lib-rust"
repository = "https://github.com/zjarlin/addzero-lib-rust"

[workspace.dependencies]
ab_glyph = "0.2.32"
automod = { package = "az-automod", version = "=2026.6.15", path = "crates/core/automod" }
base64 = "0.22.1"
convert_case = "0.8.0"
chrono = { version = "0.4.42", features = ["clock"] }
deunicode = "1.6.2"
derive_more = { version = "2.1.1", features = ["as_ref", "debug", "display", "from"] }
dioxus = { version = "0.7.9", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = "0.7.9"
manganis = "0.7.9"
dirs = "6"
clap = { version = "4.5.48", features = ["derive"] }
handlebars = "6.4.1"
half = "2.7.1"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25.0"
inventory = "0.3.21"
lettre = "0.11.19"
md5 = "0.8.0"
log = "0.4.28"
loro = "1.12.0"
mime_guess = "2.0.5"
ndarray = "0.17.1"
ort = "2.0.0-rc.12"
pinyin = "0.11.0"
prettyplease = "0.2.37"
proc-macro2 = "1.0.103"
quick-xml = "0.38.4"
quote = "1.0.41"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-tls"] }
ring = "0.17.14"
rudi = { version = "0.8.3", default-features = false, features = ["auto-register", "rudi-macro"] }
rqrr = { version = "0.10.1", default-features = false, features = ["img"] }
rusty-tesseract = "1.1.10"
rumqttc = "0.25.1"
rust-i18n = "3.1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_json_path = "0.7.2"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
shlex = "1.3.0"
ssh2 = "0.9.5"
syn = { version = "2.0.108", features = ["full", "parsing"] }
tempfile = "3.23.0"
tree-sitter = "0.26.9"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
toml_edit = { version = "0.22.27", features = ["serde"] }
trybuild = "1.0.112"
zip = "4.6.1"
anyhow = "1.0.102"
async-openai = { version = "0.41.0", features = ["full"] }
async-trait = "0.1.89"
dotenvy = "0.15.7"
urlencoding = "2.1"
uuid = { version = "1.23.1", features = ["v4", "serde", "js"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
toasty = { version = "0.7.0", features = ["jiff", "postgresql", "serde"] }
