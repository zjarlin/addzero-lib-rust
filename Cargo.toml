[workspace]
resolver = "2"
members = [
    "apps/*/backend",
    "crates/api/*",
    "crates/apps/*",
    "crates/config/*",
    "crates/core/*",
    "crates/data/*",
    "crates/music/*",
    "crates/network/*",
    "crates/runtime/*",
    "crates/storage/*",
    "crates/text/*",
]
exclude = [
    "crates/runtime/az-admin-domain-audit",
    "crates/ui/az-remote-ui",
    "crates/ui/dioxus-components",
    "crates/ui/dioxus-nox-markdown",
]

[workspace.package]
version = "2026.5.10"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
homepage = "https://github.com/zjarlin/addzero-lib-rust"
repository = "https://github.com/zjarlin/addzero-lib-rust"

[workspace.dependencies]
automod = "1.0.16"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock"] }
deunicode = "1.6.2"
dirs = "6"
hmac = "0.12.1"
inventory = "0.3.21"
lettre = "0.11.19"
md5 = "0.8.0"
log = "0.4.28"
mime_guess = "2.0.5"
pinyin = "0.11.0"
proc-macro2 = "1.0.103"
quick-xml = "0.38.4"
quote = "1.0.41"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-tls"] }
ring = "0.17.14"
rumqttc = "0.25.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
shaku = "0.6.2"
shlex = "1.3.0"
ssh2 = "0.9.5"
syn = { version = "2.0.108", features = ["full", "parsing"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
toml_edit = { version = "0.22.27", features = ["serde"] }
trybuild = "1.0.112"
zip = "4.6.1"
anyhow = "1.0.99"
async-trait = "0.1.89"
urlencoding = "2.1"
uuid = { version = "1.23.1", features = ["v4", "serde", "js"] }
tokio = { version = "1.47.1", features = ["full"] }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
futures-util = "0.3.31"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls"] }
axum = { version = "0.8.6", features = ["http1", "json", "tokio", "ws"] }
az-agent-runtime-contract = { version = "=2026.5.10", path = "crates/data/az-agent-runtime-contract" }
az-ai-agent = { version = "=2026.5.10", path = "crates/runtime/az-ai-agent" }
az-ai-chat = { version = "=2026.5.10", path = "crates/api/az-ai-chat" }
az-assets = { version = "=2026.5.10", path = "crates/data/az-assets" }
az-cli-market-contract = { version = "=2026.5.10", path = "crates/api/az-cli-market-contract" }
az-context = { version = "=2026.5.10", path = "crates/core/az-context" }
az-dict-spec = { version = "=2026.5.10", path = "crates/core/az-dict-spec" }
az-drive-agent = { version = "=2026.5.10", path = "crates/runtime/az-drive-agent" }
az-drive-core = { version = "=2026.5.10", path = "crates/storage/az-drive-core" }
az-drive-store = { version = "=2026.5.10", path = "crates/storage/az-drive-store" }
az-drive-webdav = { version = "=2026.5.10", path = "crates/network/az-drive-webdav" }
az-kiro-auth-support = { version = "=2026.5.10", path = "crates/api/az-kiro-auth-support" }
az-knowledge = { version = "=2026.5.10", path = "crates/data/az-knowledge" }
az-minio = { version = "=2026.5.10", path = "crates/storage/az-minio" }
az-music = { version = "=2026.5.10", path = "crates/music/az-music" }
az-persistence = { version = "=2026.5.10", path = "crates/data/az-persistence" }
az-plugin-contract = { version = "=2026.5.10", path = "crates/runtime/az-plugin-contract" }
az-plugin-macros = { version = "=2026.5.10", path = "crates/runtime/az-plugin-macros" }
az-plugin-registry = { version = "=2026.5.10", path = "crates/runtime/az-plugin-registry" }
az-plugin-runtime = { version = "=2026.5.10", path = "crates/runtime/az-plugin-runtime" }
az-remote-model = { version = "=2026.5.10", path = "crates/core/az-remote-model" }
az-remote-protocol = { version = "=2026.5.10", path = "crates/network/az-remote-protocol" }
az-rustfs = { version = "=2026.5.10", path = "crates/storage/az-rustfs" }
az-sandbox = { version = "=2026.5.10", path = "crates/core/az-sandbox" }
az-sms = { version = "=2026.5.10", path = "crates/network/az-sms" }
az-script-engine = { version = "=2026.5.10", path = "crates/runtime/az-script-engine" }
az-script-engine-rhai = { version = "=2026.5.10", path = "crates/runtime/az-script-engine-rhai" }
az-skills = { version = "=2026.5.10", path = "crates/data/az-skills" }
az-software-catalog = { version = "=2026.5.10", path = "crates/data/az-software-catalog" }
az-starter-audit = { version = "=2026.5.10", path = "crates/runtime/az-starter-audit" }
az-starter-dictionary = { version = "=2026.5.10", path = "crates/runtime/az-starter-dictionary" }
az-starter-identity = { version = "=2026.5.10", path = "crates/runtime/az-starter-identity" }
az-starter-menu = { version = "=2026.5.10", path = "crates/runtime/az-starter-menu" }
az-starter-organization = { version = "=2026.5.10", path = "crates/runtime/az-starter-organization" }
az-starter-storage = { version = "=2026.5.10", path = "crates/runtime/az-starter-storage" }
az-system-starters = { version = "=2026.5.10", path = "crates/runtime/az-system-starters" }
az-temp-mail = { version = "=2026.5.10", path = "crates/network/az-temp-mail" }
az-tui = { version = "=2026.5.10", path = "crates/apps/az-tui" }
az-wasm-plugin-api = { version = "=2026.5.10", path = "crates/runtime/az-wasm-plugin-api" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
