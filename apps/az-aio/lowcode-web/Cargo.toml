[package]
name = "lowcode-web"
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
description = "Lowcode wasm frontend using adui-dioxus components"

[workspace]

[dependencies]
dioxus = { version = "0.7", features = ["web", "macro", "signals", "hooks", "html", "launch"] }
adui-dioxus = { path = "../../../vendor/adui-dioxus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
gloo-net = "0.6"
uuid = { version = "1", features = ["v4", "js"] }
chrono = { version = "0.4", features = ["wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
log = "0.4"
console_log = "1"
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"
