[package]
name = "az-aio-web"
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
description = "AZ AIO web workbench — Axum + SSR."
workspace = "../plugins"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.6", features = ["http1", "json", "tokio"] }
az-aio-platform = { path = "../platform" }
asset-hub = { path = "../plugins/asset-hub" }
config-center = { path = "../plugins/config-center" }
drive-center = { path = "../plugins/drive-center" }
edge-gateway = { path = "../plugins/edge-gateway" }
algorithm-center = { path = "../plugins/algorithm-center" }
software-center = { path = "../plugins/software-center" }
lowcode = { path = "../plugins/lowcode" }
dioxus = { version = "0.7.9", default-features = false, features = ["html", "macro", "signals"] }
dioxus-ssr = "0.7.9"
serde = { version = "1.0.228", features = ["derive"] }
shaku = "0.6.2"
tokio.workspace = true
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["fs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
