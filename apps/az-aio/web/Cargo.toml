[package]
name = "az-aio-web"
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
description = "web workbench — Axum + SSR."
workspace = "../plugins"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.6", features = ["http1", "json", "tokio"] }
az-aio-platform = { path = "../platform" }
az-engine.workspace = true
asset-hub = { path = "../plugins/asset-hub" }
config-center = { path = "../plugins/config-center" }
drive-center = { path = "../plugins/drive-center" }
edge-gateway = { path = "../plugins/edge-gateway" }
algorithm-center = { path = "../plugins/algorithm-center" }
software-center = { path = "../plugins/software-center" }
az-linux = { path = "../plugins/az-linux" }
lowcode = { path = "../plugins/lowcode" }
rudi.workspace = true
tokio.workspace = true
toasty.workspace = true
tower-http = { version = "0.6.2", features = ["fs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
