[package]
name = "az-aio-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "App-local AZ AIO plugin host and contribution aggregator."

[dependencies]
az-aio-plugin-api = { path = "../api" }
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
wasmtime = { version = "38.0.4", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
