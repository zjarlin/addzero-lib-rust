[package]
name = "az-aio-plugin-hello-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Minimal AZ AIO WIT component plugin example."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
az-aio-plugin-api = { path = "../../api" }
serde_json = "1.0.145"
wit-bindgen = "0.57.1"

[lints.rust]
# wit-bindgen exports a component ABI that expands to unsafe C-ABI glue.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
