[package]
name = "az-aio-plugin-git-clis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "AZ AIO git CLI feature plugin and ~/.add_fn generator."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
az-aio-plugin-api = { path = "../../../api" }
wit-bindgen = "0.57.1"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
# wit-bindgen exports a component ABI that expands to unsafe C-ABI glue.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
