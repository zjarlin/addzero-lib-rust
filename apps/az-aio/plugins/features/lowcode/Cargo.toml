[package]
name = "az-aio-plugin-lowcode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "AZ AIO low-code platform feature plugin."

[lib]
crate-type = ["rlib"]

[[bin]]
name = "az-aio-lowcode"
path = "src/main.rs"

[dependencies]
automod.workspace = true
az-aio-plugin-api = { path = "../../api" }
anyhow.workspace = true
axum = { version = "0.8.6", features = ["json", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "sync"] }
toasty = { version = "0.7.0", features = ["postgresql"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.145"
tower = { version = "0.5.2", features = ["util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
