[package]
name = "az-aio-plugin-lowcode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "AZ AIO low-code platform feature plugin."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "az-aio-lowcode"
path = "src/main.rs"

[dependencies]
automod.workspace = true
az-aio-plugin-api = { path = "../../api" }
wit-bindgen = "0.57.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.6", features = ["json", "tokio"] }
az-config-center-client = { path = "../../../../../crates/api/az-config-center-client" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "sync"] }
toasty = { version = "0.7.0", features = ["postgresql"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.145"
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
# wit-bindgen exports a component ABI that expands to unsafe C-ABI glue.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
