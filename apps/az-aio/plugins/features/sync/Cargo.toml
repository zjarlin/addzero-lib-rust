[package]
name = "az-aio-plugin-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "AZ AIO CRDT file synchronization feature plugin."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "az-aio"
path = "src/main.rs"

[dependencies]
az-aio-plugin-api = { path = "../../api" }
wit-bindgen = "0.57.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.6", features = ["json", "ws"] }
az-line-crdt = { path = "../../../../../crates/text/az-line-crdt" }
az-rustfs = { path = "../../../../../crates/storage/az-rustfs" }
futures-util = "0.3.31"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.145"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
# wit-bindgen exports a component ABI that expands to unsafe C-ABI glue.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
