[workspace]
resolver = "2"
members = [
    "../desktop",
    "../shared",
    "../web",
    "api",
    "asset-hub",
    "bundled",
    "config-center",
    "drive-center",
    "edge-gateway",
    "host",
    "software-center",
    "features/catalog",
    "features/git/clis",
    "features/git/envs",
    "features/git/notes",
    "features/git/skills",
    "features/lowcode",
    "features/navigation",
    "features/projects",
    "features/search",
    "features/admin-bridge",
    "features/settings",
    "features/sync",
]

[workspace.package]
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]

[workspace.dependencies]
anyhow = "1.0.99"
axum = { version = "0.8.6", features = ["http1", "json", "tokio"] }
automod = "1.0.16"
az-admin-plugin-registry = { version = "=2026.5.10", path = "../../../crates/runtime/az-admin-plugin-registry" }
az-starter-audit = { version = "=2026.5.10", path = "../../../crates/runtime/az-starter-audit" }
az-starter-dictionary = { version = "=2026.5.10", path = "../../../crates/runtime/az-starter-dictionary" }
az-starter-identity = { version = "=2026.5.10", path = "../../../crates/runtime/az-starter-identity" }
az-starter-menu = { version = "=2026.5.10", path = "../../../crates/runtime/az-starter-menu" }
az-starter-organization = { version = "=2026.5.10", path = "../../../crates/runtime/az-starter-organization" }
az-system-starters = { version = "=2026.5.10", path = "../../../crates/runtime/az-system-starters" }
az-derive-aliases = { version = "=2026.6.13", path = "../../../crates/core/az-derive-aliases" }
dioxus = { version = "0.7.9", default-features = false, features = ["html", "macro", "signals"] }
handlebars = "6.4.1"
inventory = "0.3.21"
md5 = "0.8.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_path = "0.7.2"
shaku = "0.6.2"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "sync"] }
toasty = { version = "0.7.0", features = ["postgresql"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
