[workspace]
resolver = "2"
members = [
    "../platform",
    "../web",
    "../ui",
    "asset-hub",
    "algorithm-center",
    "config-center",
    "drive-center",
    "edge-gateway",
    "software-center",
    "az-linux",
    "lowcode",
]

[workspace.package]
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]

[workspace.dependencies]
az-algorithm = { version = "=2026.5.10", path = "../../../crates/algorithm/az-algorithm" }
az-str = { version = "=2026.5.10", path = "../../../crates/text/az-str" }
anyhow = "1.0.99"
automod = { package = "az-automod", version = "=2026.6.15", path = "../../../crates/core/az-automod" }
axum = { version = "0.8.6", features = ["http1", "json", "tokio", "multipart"] }
az-admin-plugin-registry = { version = "=2026.5.10", path = "../../../crates/runtime/az-admin-plugin-registry" }
az-crud-base = { version = "=2026.5.10", path = "../../../crates/data/az-crud-base" }
az-aio-ui = { path = "../ui" }
dioxus = { version = "0.7.9", default-features = false, features = ["macro", "html", "signals", "router"] }
dioxus-ssr = "0.7.9"
tw-merge = { package = "tw_merge", version = "0.1.21", features = ["debug"] }
az-engine = { version = "=2026.5.10", path = "../../../crates/runtime/az-engine" }
az-system-starters = { version = "=2026.5.10", path = "../../../crates/runtime/az-system-starters" }
rudi = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "sync"] }
tracing = "0.1.44"
toasty = { version = "0.7.0", features = ["postgresql", "serde"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
handlebars = "6.4.1"
md5 = "0.8.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-tls"] }
serde_json_path = "0.7.2"
tower = { version = "0.5.2", features = ["timeout", "util"] }
tower-http = { version = "0.6.2", features = ["fs"] }
urlencoding = "2"
