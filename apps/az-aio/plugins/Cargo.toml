[workspace]
resolver = "2"
members = [
    "../platform",
    "../web",
    "asset-hub",
    "config-center",
    "drive-center",
    "edge-gateway",
    "software-center",
    "lowcode",
]

[workspace.package]
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]

[workspace.dependencies]
anyhow = "1.0.99"
automod = "1.0.16"
axum = { version = "0.8.6", features = ["http1", "json", "tokio"] }
dioxus = { version = "0.7.9", default-features = false, features = ["html", "macro", "signals"] }
inventory = "0.3.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shaku = "0.6.2"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "sync"] }
toasty = { version = "0.7.0", features = ["postgresql"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
az-derive-aliases = { version = "=2026.6.13", path = "../../../crates/core/az-derive-aliases" }
handlebars = "6.4.1"
md5 = "0.8.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-tls"] }
serde_json_path = "0.7.2"
