[package]
name = "az-aio-desktop"
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
homepage = "https://github.com/zjarlin/addzero-lib-rust"
repository = "https://github.com/zjarlin/addzero-lib-rust"
description = "Dioxus desktop shell for AZ AIO."
workspace = "../plugins"

[dependencies]
automod.workspace = true
az-aio-plugin-api = { path = "../plugins/api" }
az-aio-plugin-host = { path = "../plugins/host" }
az-aio-shared = { path = "../shared" }
dioxus = { version = "0.7.9", default-features = false, features = [
    "asset",
    "desktop",
    "document",
    "html",
    "hooks",
    "launch",
    "macro",
    "signals",
] }
tokio = { version = "1.47.1", features = ["net", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
