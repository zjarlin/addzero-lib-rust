[package]
name = "az-aio-desktop"
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
homepage = "https://github.com/zjarlin/addzero-lib-rust"
repository = "https://github.com/zjarlin/addzero-lib-rust"
description = "Dioxus desktop shell for AZ AIO."

[dependencies]
automod = "1.0.16"
az-dioxus-components = { path = "../../../crates/ui/az-dioxus-components" }
az-git = { path = "../../../crates/network/az-git" }
az-aio-plugin-api = { path = "../plugins/api" }
az-aio-plugin-host = { path = "../plugins/host" }
dirs = "6"
dioxus = { version = "0.7.9", default-features = false, features = [
    "asset",
    "desktop",
    "document",
    "html",
    "hooks",
    "launch",
    "macro",
    "signals",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
] }
tokio = { version = "1.47.1", features = ["rt"] }
url = "2.5.7"

[workspace]
resolver = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
