[package]
name = "az-aio-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "AZ AIO browser Dioxus client shell."
workspace = "../plugins"

[dependencies]
adui-dioxus.workspace = true
dioxus = { workspace = true, features = ["web", "router", "launch", "hooks", "document"] }
dioxus-web = "0.7.9"
gloo-net = { version = "0.6.0", features = ["http", "json"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = ["Document", "Element", "HtmlElement", "Location", "Window", "History"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
