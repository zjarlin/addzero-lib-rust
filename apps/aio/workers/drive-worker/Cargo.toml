[package]
name = "az-aio-drive-worker"
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
description = "Drive CRDT sync worker."
workspace = "../../plugins"

[lib]
crate-type = ["rlib"]

[dependencies]
automod.workspace = true
az-aio-plugin-api = { path = "../../plugins/api" }
anyhow.workspace = true
axum = { version = "0.8.6", features = ["json", "ws"] }
az-crdt = { path = "../../../../crates/text/crdt" }
az-drive-core = { path = "../../../../crates/storage/drive-core" }
az-drive-store = { path = "../../../../crates/storage/drive-store" }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock"] }
futures-util = "0.3.31"
log = "0.4.28"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
tokio-tungstenite = "0.29"
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
