[package]
name = "codex-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "App-local Codex plugin host and contribution aggregator."

[dependencies]
codex-plugin-api = { path = "../api" }
codex-plugin-catalog = { path = "../builtin/catalog" }
codex-plugin-core-nav = { path = "../builtin/core-nav" }
codex-plugin-shell = { path = "../builtin/shell" }
codex-plugin-skills = { path = "../builtin/skills" }
serde_json = "1.0.145"
thiserror = "2.0.17"
wasmtime = { version = "38.0.4", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
